// ICU NG Capture: ordinary Android app (not an ATAK plugin) that owns the
// camera, microphone and encoder in a camera/microphone foreground service,
// so a stream keeps running with the screen off. The ATAK plugin is only
// its user interface - see CaptureContract for the interface between them.
plugins {
    id("com.android.application")
}

android {
    namespace 'com.carlosgt.icung.capture'
    compileSdk 36

    defaultConfig {
        applicationId 'com.carlosgt.icung.capture'
        minSdk 26
        targetSdk 34
        versionCode 10101
        versionName '1.1.1'
    }

    buildFeatures {
        aidl = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Release signing key: kept out of the repository. Its properties file
    // (storeFile, storePassword, keyAlias, keyPassword) is
    // ~/.config/atak-plugins/keys/icung-capture.properties, or the path in
    // local.properties as capture.signing.properties. Every update of the
    // app must be signed with the same key - lose it and installed copies
    // can no longer be updated.
    def signingProps = new Properties()
    def localProps = rootProject.file('local.properties')
    if (localProps.isFile()) localProps.withInputStream { signingProps.load(it) }
    def keyFile = file(signingProps.getProperty('capture.signing.properties',
            "${System.getProperty('user.home')}/.config/atak-plugins/keys/icung-capture.properties"))
    def releaseKey = new Properties()
    if (keyFile.isFile()) keyFile.withInputStream { releaseKey.load(it) }

    signingConfigs {
        if (releaseKey.getProperty('storeFile')) {
            release {
                storeFile file(releaseKey.getProperty('storeFile'))
                storePassword releaseKey.getProperty('storePassword')
                keyAlias releaseKey.getProperty('keyAlias')
                keyPassword releaseKey.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseKey.getProperty('storeFile')) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("ICU NG Capture: no release key at ${keyFile}, release APK left unsigned")
            }
        }
    }
}

dependencies {
    implementation 'com.github.pedroSG94.RootEncoder:library:2.8.1'
    // USB (UVC) cameras
    implementation 'com.herohan:UVCAndroid:1.0.13'
}

// Same RTSP client as the plugin: RootEncoder's, plus the KLV track.
configurations.all {
    resolutionStrategy.dependencySubstitution {
        substitute module('com.github.pedroSG94.RootEncoder:rtsp') using project(':rootencoder-rtsp')
    }
}
