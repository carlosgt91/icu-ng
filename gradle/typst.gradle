// Builds the user manual. setupTypst is the hardened version from the
// atak-plugin-pipeline skill (curl -f, retries, prefers a typst on PATH).

def typstOnPath = {
    (System.getenv("PATH") ?: "").split(File.pathSeparator)
            .collect { new File(it, "typst") }
            .find { it.isFile() && it.canExecute() }
}

task setupTypst {
    group = "typst"
    description = "Downloads the pinned Typst binary, unless one is on PATH."

    // Pin the version tak.gov builds with, and verify the manual against that
    // version rather than whatever is installed locally.
    def typstUrl = "https://github.com/typst/typst/releases/download/v0.13.1/typst-x86_64-unknown-linux-musl.tar.xz"
    def downloadDir = file("${buildDir}/typst")
    def tarFile = file("${downloadDir}/typst.tar.xz")
    def extractDir = file("${downloadDir}/extracted")
    def binary = file("${extractDir}/typst-x86_64-unknown-linux-musl/typst")

    inputs.property("typstUrl", typstUrl)
    outputs.dir(extractDir)

    doLast {
        def onPath = typstOnPath()
        if (onPath != null) {
            println "typst already on PATH (${onPath.absolutePath}), not downloading"
            extractDir.mkdirs()
            return
        }
        if (binary.isFile()) {
            return  // already downloaded and extracted
        }

        downloadDir.mkdirs()
        extractDir.mkdirs()

        // -f so an HTTP error is an error. --retry because this is a shared
        // builder pulling 30 MB from GitHub once per ATAK target, and a
        // transient failure there is not a reason to fail a submission.
        def cmd = ["curl", "-fsSL", "--retry", "5", "--retry-delay", "2",
                   "--retry-all-errors", "--connect-timeout", "30",
                   typstUrl, "-o", tarFile.absolutePath]
        println "Executing: ${cmd.join(' ')}"
        def dl = cmd.execute()
        // Drain the streams. The stock task called waitFor() without reading
        // them, so curl could fill the pipe buffer and block forever.
        dl.waitForProcessOutput(System.out, System.err)
        if (dl.exitValue() != 0) {
            throw new GradleException("Could not download typst from ${typstUrl}"
                    + " (curl exit ${dl.exitValue()}). The user manual cannot be"
                    + " built without it.")
        }
        if (!tarFile.isFile() || tarFile.length() < 1024 * 1024) {
            throw new GradleException("The typst download is too small to be the"
                    + " release tarball (${tarFile.length()} bytes). The server"
                    + " answered with something other than the archive.")
        }

        def ex = ["tar", "-xf", tarFile.absolutePath, "-C",
                  extractDir.absolutePath].execute()
        ex.waitForProcessOutput(System.out, System.err)
        if (ex.exitValue() != 0) {
            throw new GradleException("Could not extract ${tarFile}"
                    + " (tar exit ${ex.exitValue()}).")
        }
        if (!binary.isFile()) {
            throw new GradleException("typst extracted but ${binary} is missing;"
                    + " the archive layout is not what was expected.")
        }
        binary.setExecutable(true)
        tarFile.delete()
    }
}

task runTypst(dependsOn: setupTypst) {
    group = "typst"
    description = "Compiles docs/user_manual/usermanual*.typ into assets/usermanual*.pdf."

    def srcDir = file("$rootDir/docs/user_manual")
    def extracted = file("$rootDir/app/build/typst/extracted/typst-x86_64-unknown-linux-musl/typst")
    def assetsDir = file("$rootDir/app/src/main/assets")

    doLast {
        // One manual per language: usermanual.typ (English, the fallback)
        // and usermanual_<lang>.typ, each into the matching
        // usermanual[_<lang>].pdf that IcuNgPreferenceFragment picks by
        // the device language.
        def typFiles = fileTree(srcDir).include('usermanual*.typ').files.sort { it.name }
        if (typFiles.isEmpty()) {
            println "Warning: No usermanual*.typ in $srcDir, will not build a user manual"
            return
        }

        // ./typst in the project root, typst on PATH, or the downloaded one
        def typst = new File("$rootDir/typst").exists() ? "$rootDir/typst"
                : (typstOnPath()?.absolutePath ?: extracted.absolutePath)
        assetsDir.mkdirs()

        typFiles.each { typFile ->
            def text = typFile.text
            text = text.replaceAll(/platform-version: ".*?"/, "platform-version: \"$ATAK_VERSION\"")
            text = text.replaceAll(/plugin-version: ".*?"/, "plugin-version: \"$PLUGIN_VERSION\"")
            typFile.text = text

            def pdf = new File(assetsDir, typFile.name.replace('.typ', '.pdf'))
            def cmd = [typst, "compile", "--root", "$rootDir", "--font-path", "$srcDir",
                       typFile.absolutePath, pdf.absolutePath]
            println "Running command: $cmd"
            def process = cmd.execute()
            process.waitForProcessOutput(System.out, System.err)
            if (process.exitValue() != 0) {
                throw new GradleException("typst failed on ${typFile.name} (exit ${process.exitValue()})")
            }
        }
    }
}

// On the official ATAK release pipeline (ATAK_CI=1), and locally with
// -PbuildManual, so APKs built here carry the manual too: without the PDF
// the Tool Preferences "User manual" entry opens nothing.
if (System.getenv("ATAK_CI") == "1" || project.hasProperty("buildManual")) {
    println("running typst to generate the user manual");
    android.applicationVariants.all { variant ->
        variant.mergeResourcesProvider.configure {
            dependsOn runTypst
        }
    }
} else {
    println("skipping user manual generation");
}
